name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  GOTOOLCHAIN: local
jobs:
  all-green:
    name: all-green
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scan legacy terms within CI
        run: |
          scanner="$RUNNER_TEMP/legacy-scanner"
          mkdir -p "$scanner"
          for file in scan.py terms.json allow-list.json owners.json; do
            curl --fail --silent --show-error --location --retry 2 \
              "https://raw.githubusercontent.com/TerraScale/terrascale/a2e200187ffe32084a10f2a81c9e3e1f59b49a29/scripts/legacy-scan/$file" \
              --output "$scanner/$file"
          done
          python3 "$scanner/scan.py" --repo terraform-provider-terrascale --root . --output "$RUNNER_TEMP/legacy-hits.md"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - uses: ./.github/actions/advisories
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.19.0
          args: check --config .goreleaser.yml
