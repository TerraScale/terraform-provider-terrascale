name: release
on:
  push:
    tags: ['*']
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Reject tags outside v0.0.X
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v0\.0\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Only stable v0.0.X tags are permitted.' >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require release commit on origin/main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version
      - name: Cache advisory scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/terrascale/govulncheck
          key: ${{ runner.os }}-${{ runner.arch }}-govulncheck-v1.9.0-${{ hashFiles('.go-version') }}
      - name: Install pinned advisory scanner
        run: bash scripts/install-govulncheck.sh
      - name: Check module advisories and source reachability
        run: |
          govulncheck -scan=module -show=verbose
          govulncheck -show=verbose ./...
      - run: go build ./...
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.19.0
          args: check --config .goreleaser.yml
      - name: Snapshot release without signing or publishing
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.19.0
          args: release --config .goreleaser.yml --snapshot --clean --skip=sign,publish
      - name: Check snapshot archives and manifest checksum
        shell: python
        run: |
          import hashlib, itertools, json, pathlib, zipfile
          dist = pathlib.Path('dist')
          archives = list(dist.glob('*.zip'))
          assert len(archives) == 6, archives
          for os_name, arch in itertools.product(('linux', 'darwin', 'windows'), ('amd64', 'arm64')):
              matches = [p for p in archives if p.name.endswith(f'_{os_name}_{arch}.zip')]
              assert len(matches) == 1, (os_name, arch, matches)
              with zipfile.ZipFile(matches[0]) as archive:
                  names = archive.namelist()
                  suffix = f'_{os_name}_{arch}.zip'
                  version = matches[0].name.removeprefix('terraform-provider-terrascale_').removesuffix(suffix)
                  expected = f'terraform-provider-terrascale_v{version}' + ('.exe' if os_name == 'windows' else '')
                  assert names == [expected], names
          sums, = dist.glob('*_SHA256SUMS')
          entries = {}
          for line in sums.read_text().splitlines():
              digest, filename = line.split(maxsplit=1)
              filename = filename.lstrip('*')
              entries[filename] = digest
              source = pathlib.Path('terraform-registry-manifest.json') if filename.endswith('_manifest.json') else dist / filename
              assert hashlib.sha256(source.read_bytes()).hexdigest() == digest, filename
          manifest_name, = [n for n in entries if n.endswith('_manifest.json')]
          assert manifest_name == sums.name.removesuffix('_SHA256SUMS') + '_manifest.json'
          assert json.loads(pathlib.Path('terraform-registry-manifest.json').read_text()) == {
              'version': 1, 'metadata': {'protocol_versions': ['6.0']}}
          assert set(entries) == {p.name for p in archives} | {manifest_name}, entries
          assert not list(dist.glob('*.asc')), 'snapshot must not sign'
      - name: Import user-provided signing key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Publish signed GitHub release
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.19.0
          args: release --config .goreleaser.yml --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
